# iOS Keychain lifecycle (PR-08, PR-12): a Spark recovery phrase left in the Keychain (it
# survives an uninstall, or an interrupted import) is never restored by itself: choosing Spark
# asks for a phrase. iOS-only fixture; the flow does nothing on Android.
appId: ${APP_ID}
tags:
  - spark
  - ios
---
- runFlow:
    when:
      platform: iOS
    commands:
      - launchApp:
          clearState: true
          arguments:
            sparkFixture: orphan
      - runFlow: ../common/onboarding-steps.yaml
      - tapOn: "Settings"
      - tapOn: "Use another wallet"
      - tapOn: "Spark"
      - assertVisible: "Recovery phrase"
      - assertNotVisible: "Wallet credential unavailable."
      - tapOn: "Cancel"
      - stopApp
      - launchApp
      - tapOn: "Settings"
      - assertVisible: "Balance"
