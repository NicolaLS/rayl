# iOS Keychain lifecycle (PR-08, PR-12): Spark is the selected wallet but its protected recovery
# phrase is unreadable. Rayl explains, retrying keeps it, removal asks first and then starts over.
# The fixture is iOS-only (iosAppE2E seeds the Keychain); the flow does nothing on Android.
appId: ${APP_ID}
tags:
  - spark
  - ios
---
- runFlow:
    when:
      platform: iOS
    commands:
      - launchApp:
          clearState: true
          arguments:
            sparkFixture: corrupt-configured
      - extendedWaitUntil:
          visible: "The protected recovery phrase or its device key is inconsistent."
          timeout: 30000
      - tapOn: "Try again"
      - assertVisible: "The protected recovery phrase or its device key is inconsistent."
      - tapOn: "Remove wallet from Rayl"
      - assertVisible: "Remove this wallet from Rayl?"
      - tapOn: "Cancel"
      - assertVisible: "The protected recovery phrase or its device key is inconsistent."
      - tapOn: "Remove wallet from Rayl"
      - tapOn: "Remove"
      - extendedWaitUntil:
          visible: "Welcome to Rayl"
          timeout: 30000
      - runFlow: ../common/onboarding-steps.yaml
      - tapOn: "Settings"
      - tapOn: "Use another wallet"
      - tapOn: "Spark"
      - assertVisible: "Recovery phrase"
      - assertNotVisible: "Wallet credential unavailable."
