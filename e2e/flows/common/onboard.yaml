# A fresh install through onboarding to the scan screen, with Rayl's wallet (no wallet connected).
appId: ${APP_ID}
---
- launchApp:
    clearState: true
    permissions:
      all: allow
- tapOn: "Get started"
- tapOn: "Continue"
- tapOn: "Continue"
# Its Continue sets up Rayl's wallet with Breez first; that can take a minute.
- runFlow: accept-risk.yaml
- extendedWaitUntil:
    visible: "Point the camera.*"
    timeout: 120000
