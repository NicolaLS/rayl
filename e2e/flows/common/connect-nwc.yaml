# Connects the local NWC stack's payer node (tools/nwc-stack) in Settings → Wallets → Add a card.
appId: ${APP_ID}
---
- runScript:
    file: ../scripts/nwc-stack.js
    env:
      ACTION: connect-uri
- tapOn: "Settings"
- tapOn:
    id: "settings_wallets"
- tapOn: "Add a card"
- tapOn: "Nostr Wallet Connect"
- tapOn: "Wallet Connect URI"
- inputText: ${output.nwcUri}
- hideKeyboard
# iOS reads the wallet's details as soon as the URI is entered; Android waits for Connect.
- tapOn:
    text: "Connect"
    optional: true
- extendedWaitUntil:
    visible: "Wallet alias.*"
    timeout: 30000
- tapOn:
    text: "Add Wallet"
    index: 1
- runFlow: accept-risk.yaml
- extendedWaitUntil:
    visible: "Point the camera.*"
    timeout: 30000
