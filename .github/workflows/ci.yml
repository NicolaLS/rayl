name: CI

permissions:
  contents: read

env:
  JAVA_VERSION: '21'

on:
  workflow_dispatch:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main, 'release/**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Shared checks
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up and validate Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Check formatting, module boundaries, localizations, and unit tests
        run: |
          ./gradlew ktlintCheck verifyModuleDependencies verifyNativeLocalizations verifyBreezSdkPins testAndroidHostTest :backend:rayl:test
          ./gradlew -p build-logic ktlintCheck

  android:
    name: Rayl Android
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up and validate Gradle
        uses: gradle/actions/setup-gradle@v6

      # The E2E build is the release build (R8, resource shrinking) with debug signing and no
      # secrets, so release-only breakage shows up here.
      - name: Assemble Debug and a release-like build
        run: ./gradlew :app:androidApp:assembleDebug :app:androidApp:assembleE2e

      # Android Lint: errors fail (API levels down to minSdk 24, manifest, security); warnings
      # stay in the reports. Settings in lint.xml.
      - name: Android Lint
        run: ./gradlew lintAndroidMain :app:androidApp:lintDebug --continue

      - name: Keep the Lint reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: '**/build/reports/lint-results-*.html'
          retention-days: 14
