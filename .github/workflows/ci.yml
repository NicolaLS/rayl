name: CI

permissions:
  contents: read

env:
  JAVA_VERSION: '21'

# DISABLED: CI cannot resolve io.github.nicolals:nwc-kmp:0.3.3-SNAPSHOT, which only exists in the
# maintainer's mavenLocal. Publish nwc-kmp (e.g. a release on Maven Central) and pin it in
# gradle/libs.versions.toml, then restore the triggers below. Until then this runs only manually.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  # pull_request:
  #   branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Shared checks
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up and validate Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Check formatting, module boundaries, localizations, and unit tests
        run: |
          ./gradlew ktlintCheck verifyModuleDependencies verifyNativeLocalizations verifyBreezSdkPins testAndroidHostTest :backend:rayl:test
          ./gradlew -p build-logic ktlintCheck

  android:
    name: Rayl Android
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up and validate Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Assemble Debug
        run: ./gradlew :app:androidApp:assembleDebug
