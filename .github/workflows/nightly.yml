name: Nightly

# Tests against real wallet services in test networks (qa/test-plan.md §6.9). They need the
# network and funded test wallets, so they never gate a pull request. Failures reach QA by
# GitHub's e-mail.

permissions:
  contents: read

env:
  JAVA_VERSION: '21'

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
  push:
    branches: ['release/**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  wallet-integration:
    name: Wallet integration (Breez regtest, local NWC and Blink)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up and validate Gradle
        uses: gradle/actions/setup-gradle@v6

      # CI has its own regtest bank, funded from QA's, so local runs never compete for its funds.
      - name: Open the CI regtest bank
        env:
          BANK_MNEMONIC: ${{ secrets.RAYL_REGTEST_BANK_MNEMONIC }}
        run: |
          echo "RAYL_REGTEST_HOME=$RUNNER_TEMP/regtest" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/regtest"
          printf '%s' "$BANK_MNEMONIC" > "$RUNNER_TEMP/regtest/bank-mnemonic"

      # An empty bank is an environment problem, not a test failure: say so separately.
      - name: Check the bank's balance
        run: |
          status="$(tools/regtest/regtest status)"
          balance="$(printf '%s\n' "$status" | awk '/^Balance:/ {print $2}')"
          echo "Regtest bank balance: ${balance:-unknown} sats"
          if [ -z "$balance" ] || [ "$balance" -lt 5000 ]; then
            echo "::error title=Regtest bank low::The CI regtest bank has ${balance:-no} sats; top it up (qa/test-plan.md §6.9)."
            exit 1
          fi

      # Core Lightning with the NIP-47 plugin and a nostr relay, on regtest.
      - name: Start the local NWC stack
        run: tools/nwc-stack/bin/up

      # Blink's own backend (its quickstart, pinned in tools/blink-stack/bin/_common) on regtest.
      - name: Start the local Blink stack
        run: tools/blink-stack/bin/up

      - name: Run the wallet integration tests
        run: ./gradlew walletIntegrationTest --continue

      - name: Keep the test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wallet-integration-reports
          path: '**/build/reports/tests/walletIntegrationTest/'
          retention-days: 14

  ui-flows-android:
    name: UI flows (Maestro, Android emulator, local NWC and Blink)
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up and validate Gradle
        uses: gradle/actions/setup-gradle@v6

      # The emulator needs hardware acceleration.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start the local NWC and Blink stacks
        run: |
          tools/nwc-stack/bin/up
          tools/blink-stack/bin/up

      - name: Build the E2E app
        run: ./gradlew :app:androidApp:assembleE2e

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # The iOS flows need the same stacks, and GitHub's macOS runners have no Docker: they run
      # locally before each release (qa/test-plan.md §6.8).
      - name: Run the flows
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb install -r app/androidApp/build/outputs/apk/e2e/androidApp-e2e.apk
            maestro test -e APP_ID=com.nicolasusca.rayl.e2e --format junit --output build/maestro/report.xml --test-output-dir build/maestro e2e/flows

      - name: Keep the flow results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-flows-android
          path: build/maestro/
          retention-days: 14

  android-device-tests:
    name: Android device tests (API ${{ matrix.api }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Keystore and encrypted storage behave differently on old Android: minSdk and current.
        api: [24, 34]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up and validate Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the device tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: ./gradlew :core:settings:connectedAndroidDeviceTest :providers:spark:integration:wallet:connectedAndroidDeviceTest :providers:rayl:integration:pocket:connectedAndroidDeviceTest --continue

      - name: Keep the test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-device-tests-${{ matrix.api }}
          path: '**/build/reports/androidTests/'
          retention-days: 14
